AWSTemplateFormatVersion: '2010-09-09'
Description: >
  proxy-reload-test lab - a single EC2 instance.
  Connect via Session Manager (no SSH key pair, no inbound security group rule).
  Docker, Compose, repo clone and image pull are all handled in user data.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network"
        Parameters: [VpcId, SubnetId]
      - Label:
          default: "Instance"
        Parameters: [InstanceType, LatestAmiId]
      - Label:
          default: "Lab Repository"
        Parameters: [RepoUrl]
    ParameterLabels:
      VpcId:
        default: "VPC"
      SubnetId:
        default: "Public Subnet (must route to an Internet Gateway)"
      InstanceType:
        default: "Instance Type"
      LatestAmiId:
        default: "AMI (leave as is)"
      RepoUrl:
        default: "Lab Repository URL (leave as is)"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the lab instance. The default VPC is fine.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Choose a PUBLIC subnet. The instance needs outbound access to
      Docker Hub, GitHub and the SSM endpoints.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: Runs 5 containers. t3.small or larger is recommended.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI, resolved automatically.

  RepoUrl:
    Type: String
    Default: https://github.com/hairyung2002/proxy_reload_test.git
    Description: Lab repository URL. Must be a public repository.

Resources:

  # Minimum permission needed for Session Manager.
  # AmazonSSMManagedInstanceCore alone is enough.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # No inbound rules at all.
  # The proxies are called from inside the instance over localhost.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: proxy-reload-test lab - outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Docker Hub, GitHub, SSM
      Tags:
        - Key: Name
          Value: proxy-reload-test-sg

  LabInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      # Attach a public IP regardless of the subnet's auto-assign setting.
      # Without outbound internet the SSM agent cannot register,
      # and Session Manager will not connect.
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref InstanceSecurityGroup]
          DeleteOnTermination: true
      InstanceInitiatedShutdownBehavior: terminate
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: proxy-reload-test
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xeuo pipefail
          exec > >(tee /var/log/lab-bootstrap.log) 2>&1

          # Skip the full system update to keep boot time short
          dnf -y install docker git

          systemctl enable --now docker
          usermod -aG docker ec2-user

          # Compose v2 plugin (not in the AL2023 default repo)
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -sSL \
            "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # Lab repository
          git clone ${RepoUrl} /home/ec2-user/proxy-reload-test
          chmod +x /home/ec2-user/proxy-reload-test/scripts/*.sh || true
          chown -R ec2-user:ec2-user /home/ec2-user/proxy-reload-test

          # Pre-pull images so the venue network is not hammered
          cd /home/ec2-user/proxy-reload-test
          docker compose --profile extra pull

          # Bring the containers up ahead of time
          docker compose up -d

          # Greeting shown on connect
          cat > /etc/motd <<'MOTD'

            proxy-reload-test lab

            cd ~/proxy-reload-test
            ./scripts/watch.sh      <- start here (leave this window open)

            Please delete the CloudFormation stack when you are done.

          MOTD

          touch /home/ec2-user/READY
          chown ec2-user:ec2-user /home/ec2-user/READY

Outputs:
  InstanceId:
    Description: Lab instance ID
    Value: !Ref LabInstance

  SessionManagerUrl:
    Description: Open in a browser to connect (no key pair needed)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${LabInstance}?region=${AWS::Region}"

  ReadyCheck:
    Description: Run this after connecting to confirm bootstrap finished
    Value: "ls ~/READY   -> if the file exists, the instance is ready"

  Cleanup:
    Description: After the session
    Value: "Please DELETE this stack from the CloudFormation console."