# ─────────────────────────────────────────────────────────────
# Nginx: 업스트림 목록이 이 파일 안에 박혀 있다.
# 이 목록을 바꾸는 유일한 방법은 파일을 고치고 reload 하는 것이다.
#
# (stock nginx.conf 의 http 블록에서 conf.d/*.conf 로 include 된다)
# ─────────────────────────────────────────────────────────────

upstream backend {
    # ▼ Step 3에서 여러분이 직접 고칠 두 줄
    server 172.28.0.11:5678 max_fails=0;   # backend-a
    server 172.28.0.12:5678 max_fails=0;   # backend-b
    #
    # max_fails=0 : passive health check 비활성화
    #   기본값(max_fails=1, fail_timeout=10s)이면 죽은 서버를 10초간
    #   목록에서 빼주기 때문에 장애가 눈에 잘 안 보인다.
    #   실습에서는 "설정에 적힌 대로만 동작한다"는 사실을
    #   그대로 관찰하기 위해 껐다.
    #
    #   참고: passive health check는 죽은 서버를 가려줄 뿐,
    #        새로 뜬 서버를 발견해주지는 못한다. 그게 오늘의 주제다.
}

server {
    listen 8080;
    access_log off;

    location / {
        proxy_pass http://backend;

        # 실패를 다른 서버로 넘기지 않는다.
        # 켜두면 nginx가 502를 감춰버려서 실습 관찰이 어렵다.
        proxy_next_upstream off;

        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }
}
