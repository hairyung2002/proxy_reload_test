# ─────────────────────────────────────────────────────────────
# Envoy 부트스트랩
#
# 리스너와 라우트는 static (오늘 주제가 아니므로 고정)
# 클러스터(CDS)와 엔드포인트(EDS)는 dynamic — 파일에서 구독한다.
#
# 실제 운영에서는 이 path 자리에 gRPC 컨트롤 플레인이 들어간다.
# 파일 기반이든 gRPC 기반이든 Envoy 입장에서는 동일한 xDS이다.
# ─────────────────────────────────────────────────────────────

node:
  id: lab-envoy
  cluster: lab

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

dynamic_resources:
  cds_config:
    path_config_source:
      path: /etc/envoy/cds.yaml

static_resources:
  listeners:
    - name: main
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: backend
                            timeout: 2s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
